name: Deploy to Somee

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    environment:
      name: production
      url: http://addiin.somee.com/

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 9.0.x

      - name: Restore dependencies
        run: dotnet restore AdDiin.sln

      - name: Publish application
        run: dotnet publish AdDiin/AdDiin.csproj --configuration Release --output ./publish --no-restore

      - name: Upload published application to Somee
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.SOMEE_FTP_SERVER }}
          username: ${{ secrets.SOMEE_FTP_USERNAME }}
          password: ${{ secrets.SOMEE_FTP_PASSWORD }}
          protocol: ftp
          port: 21
          local-dir: ./publish/
          server-dir: ${{ secrets.SOMEE_FTP_SERVER_DIR }}
          dangerous-clean-slate: false
