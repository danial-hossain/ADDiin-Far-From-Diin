<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Website Paused | ADDiin Focus</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #020617;
      color: #f8fafc;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .card {
      max-width: 520px;
      width: 100%;
      background-color: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 28px;
      padding: 32px;
      text-align: center;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }
    .icon-box {
      width: 64px;
      height: 64px;
      border-radius: 20px;
      background-color: rgba(99, 102, 241, 0.15);
      color: #818cf8;
      border: 1px solid rgba(99, 102, 241, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      margin: 0 auto 16px auto;
    }
    .badge {
      display: inline-block;
      padding: 4px 12px;
      background-color: rgba(245, 158, 11, 0.15);
      color: #fcd34d;
      font-size: 11px;
      font-weight: 700;
      border-radius: 9999px;
      border: 1px solid rgba(245, 158, 11, 0.25);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 8px;
    }
    h1 {
      font-size: 24px;
      font-weight: 800;
      color: #ffffff;
      text-transform: capitalize;
      margin-bottom: 6px;
    }
    .desc {
      font-size: 13px;
      color: #94a3b8;
      line-height: 1.5;
      margin-bottom: 24px;
    }
    .ayah-box {
      background: linear-gradient(135deg, rgba(6, 78, 59, 0.4) 0%, rgba(15, 23, 42, 0.9) 100%);
      border: 1px solid rgba(16, 185, 129, 0.25);
      border-radius: 18px;
      padding: 20px;
      text-align: left;
      margin-bottom: 24px;
    }
    .ayah-title {
      font-size: 11px;
      font-weight: 700;
      color: #34d399;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 8px;
      display: block;
    }
    .ayah-arabic {
      font-size: 22px;
      font-weight: 700;
      color: #fde68a;
      text-align: right;
      line-height: 1.8;
      margin-bottom: 8px;
      font-family: 'Amiri', 'Traditional Arabic', serif;
    }
    .ayah-trans {
      font-size: 12px;
      color: #cbd5e1;
      font-style: italic;
      border-top: 1px solid rgba(16, 185, 129, 0.15);
      padding-top: 8px;
    }
    .actions {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .btn {
      display: block;
      width: 100%;
      padding: 14px 16px;
      border-radius: 14px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
      text-align: center;
      transition: all 0.2s ease;
      border: none;
    }
    .btn:active {
      transform: scale(0.99);
    }
    .btn-secondary {
      background-color: #1e293b;
      color: #e2e8f0;
      border: 1px solid #334155;
    }
    .btn-secondary:hover {
      background-color: #334155;
    }
    .btn-primary {
      background-color: #059669;
      color: #ffffff;
      box-shadow: 0 10px 15px -3px rgba(5, 150, 105, 0.3);
    }
    .btn-primary:hover {
      background-color: #10b981;
    }
  </style>
</head>
<body>
  
  <div class="card">
    <div class="icon-box">🛡️</div>
    
    <div>
      <span class="badge">Far Mode • Distraction Blocked</span>
      <h1 id="domainTitle">Website Paused</h1>
      <p class="desc">Access to this platform is paused while you are in focus mode.</p>
    </div>

    <div class="ayah-box">
      <span class="ayah-title">✨ Spiritual Reflection</span>
      <p class="ayah-arabic">أَلَا بِذِكْرِ اللَّهِ تَطْمَئِنُّ الْقُلُوبُ</p>
      <p class="ayah-trans">"Unquestionably, by the remembrance of Allah hearts are assured." — Surah Ar-Ra'd (13:28)</p>
    </div>

    <div class="actions">
      <button id="btnUnblock" type="button" class="btn btn-secondary">
        🔓 Temporary 5-Min Pass (Unblock)
      </button>

      <a id="linkApp" href="http://localhost:5091/focus" target="_blank" class="btn btn-primary">
        🕌 Open ADDiin Platform
      </a>
    </div>
  </div>

  <script src="blocked.js"></script>
</body>
</html>
